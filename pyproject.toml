[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nankan-keiba"
version = "0.1.0"
description = "南関東競馬のレース結果を netkeiba から低負荷で収集するツール（個人利用向け）"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-requests==2.32.0.20241016",
]

[project.scripts]
nankan-keiba = "nankan_keiba.cli:main"

[tool.setuptools]
packages = ["nankan_keiba"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
